# Music packs -- mods/wav_music.cfg
#
# Play your own audio instead of a game song. Left side: the song's file
# name exactly as it appears in Assets/music/. Right side: the file to
# stream (absolute path, or relative to the game folder). Quotes are
# optional but keep paths with spaces safe. '#' starts a comment.
#
# Three formats work (told apart by content, the extension doesn't matter):
#   .wav   PCM 8/16/24/32-bit or float, mono/stereo, any rate. Loops whole.
#   .ogg   OGG Vorbis, any channel layout (downmixed). Loops whole.
#   .rbxs  Robox sound header + OGG/WAV payload. The header adds LOOP
#          POINTS (intro plays once, then the loop region repeats), forced
#          rate, mono downmix, or play-once. Build one with:
#              python tools/make_rbxs.py song.ogg out.rbxs --loop START END
#          (loop points in frames; fixed 24-byte header, ":P" at offset 0xE)
#
# Songs pause/resume with the game like normal music. A song without a line
# here (or whose file is missing/broken) plays its normal MIDI music, so you
# can replace as few or as many songs as you like.
#
# The game's songs (Assets/music/):
#   comienzo.jul        title / opening
#   bosque.dan          forest
#   cueva.san           cave
#   gelatina.nac        gelatina
#   interiorrobot.ati   robot interiors
#   jefe.bdr            boss
#   jefeepic1.zbg       boss (epic)
#   tension.dum         tension
#
# Examples -- uncomment and point at real files:
# comienzo.jul = "C:\Music\my title theme.wav"
# bosque.dan   = mods/wavs/forest.wav
#
# '*' plays one WAV for every song that has no line of its own:
# * = mods/wavs/everything.wav

# Volume for WAV music, 0..100.
volume = 80

# --- party mode ------------------------------------------------------------
# Studiopolis Zone Act 1, converted from the .opus with:
#   ffmpeg -i "Lights, Camera, Action! ...opus" -c:a libvorbis -q:a 5 \
#          -ar 44100 -ac 2 mods/wavs/studiopolis.ogg
# (stb_vorbis decodes Vorbis, not Opus, so the container had to change.)
#
# The party forces level 01a, and 01a's song is bosque.dan -- which YOUR line
# below already claimed, so '*' never got a look in: robox_wav.c returns on the
# first key that matches, so the earliest line for a song wins and a second one
# lower down is dead. Hence overriding it here rather than appending.
#
# YOUR ORIGINAL -- put this back and delete the line under it to get mori_lr
# playing on the forest again:
# bosque.dan = "mods/wavs/mori_lr.ry.32.rbxs"
# NOTE: pop.ogg was an Ogg *video* -- a Theora stream on page 0 with the Vorbis
# audio multiplexed alongside it (album art, most likely). stb_vorbis only
# reads single-stream Vorbis, so it saw Theora first and bailed with error 34,
# "invalid first page". Stripped with:
#     ffmpeg -i pop.ogg -vn -c:a copy pop_audio.ogg
# -c:a copy, so the audio is the original bits, not a re-encode.
#bosque.dan = "mods/wavs/pop_audio.ogg"

# No '*' line on purpose. '*' catches every song without one of its own, which
# includes comienzo.jul -- the title screen -- so the track was playing before
# you ever reached a level. Only bosque.dan is mapped, so the party level gets
# it and everything else keeps the game's own music.
